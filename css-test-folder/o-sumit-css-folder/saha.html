<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #fadcb5;
      }

      .container {
      }

      div {
        text-align: center;
        color: white;
      }

      .o {
        background-color: aquamarine;
      }
      .t {
        background-color: red;
      }
      .tr {
        background-color: blue;
      }
      .f {
        background-color: blueviolet;
      }
      .fi {
        background-color: brown;
      }
      .s {
        background-color: cadetblue;
      }

      .container {
        height: 300px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        grid-gap: 3px;
        grid-auto-flow: dense;
      }

      .container div {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .t {
        grid-column: span 2;
      }

      .o {
        grid-row: span 2;
      }

      .f {
        grid-column: span 2;
        grid-row:  span 2;
      }

      .tr {
        grid-column: span 2;
        grid-row: span 2;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="o">1</div>
      <div class="t">2</div>
      <div class="tr">3</div>
      <div class="f">4</div>
      <div class="o">5</div>
      <div class="tr">6</div>
      <div class="t seven">7</div>
      <div class="o">8</div>
      <div class="tr">9</div>
      <div class="f">10</div>
    </div>
  </body>
</html>
