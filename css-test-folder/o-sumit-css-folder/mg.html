<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikipedia</title>
    <link rel="stylesheet" href="mg.css">
</head>
<body>
    
    <div class="main">
        <div class="planet">The Planet Earth</div>
        <div class="space">
            <img src="myphoto.jpg" width="15" alt="">
            <label for="">EARTH FROM SPACE</label>
        </div>
        <div class="type">
            <span>Type</span>
            <span class="sor">Terrestrial planet</span>
        </div>
        <hr class="hr">
        <div class="type">
            <span>Orbitial period</span>
            <span class="sor">365.256 days</span>
        </div>
        <hr class="hr">
        <div class="type">
            <span>Population</span>
            <span class="sor">8.04 Billion (2026)</span>
        </div>
        <hr class="hr">
        <div class="type">
            <span>Surface water</span>
            <span class="sor bl">70.8%</span>
        </div>
    </div>
    
</body>
</html>
