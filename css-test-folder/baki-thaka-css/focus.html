<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus</title>
    <style>
      input {
        padding: 10px;
        border: 3px solid black;
        outline: none;
        border-radius: 10px;
      }
      input:focus {
        border-color: rgb(0, 204, 255);
        box-shadow: 0 0 8px #857f7f;
      }
    </style>
  </head>
  <body>
    <input type="text" placeholder="Click here" />
  </body>
</html>
