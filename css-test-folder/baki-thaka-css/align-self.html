<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Align Self</title>
    <style>
      .container {
        height: 400px;
        align-items: center;
        display: flex;
        gap: 15px;
      }
      .box {
        width: 1200px;
        height: 100px;
        background-color: aqua;
        color: darkgoldenrod;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .top {
        align-self: flex-start;
      }
      .bottom {
        align-self: flex-end;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">Normal</div>
      <div class="box top">Top</div>
      <div class="box bottom">Bottom</div>
    </div>
  </body>
</html>
