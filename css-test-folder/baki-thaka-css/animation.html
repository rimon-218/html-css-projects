<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation</title>
    <style>
      @keyframes movebox {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(300px);
        }
      }
      .box {
        background-color: aqua;
        width: 100px;
        height: 100px;
        animation: movebox 2s infinite alternate;
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
  </body>
</html>
