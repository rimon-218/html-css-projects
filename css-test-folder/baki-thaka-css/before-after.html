<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Before After</title>
    <style>
      .title {
        position: relative;
        display: inline-block;
        padding: 10px;
      }
      .title::after {
        content: "";
        display: block;
        width: 100%;
        height: 5px;
        background-color: black;
        margin-top: 10px;
      }
      .title::before {
        content: "@";
        margin-right: 10px;
      }
    </style>
  </head>
  <body>
    <h1 class="title">My Website</h1>
  </body>
</html>
