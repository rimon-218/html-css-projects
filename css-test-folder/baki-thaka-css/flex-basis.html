<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex Basis</title>
    <style>
      .container {
        display: flex;
        gap: 10px;
      }
      .box {
        height: 100px;
        background-color: aqua;
        color: #ff0202;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-grow: 1;
        flex-basis: 150px;
      }
      .large {
        flex-basis: 300px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">Box 1</div>
      <div class="box large">Box 2</div>
      <div class="box">Box 3</div>
    </div>
  </body>
</html>
