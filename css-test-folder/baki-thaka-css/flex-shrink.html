<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex Shrink</title>
    <style>
      .container {
        display: flex;
        width: 500px;
        gap: 10px;
      }
      .box {
        width: 300px;
        height: 100px;
        background-color: aqua;
        color: brown;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-shrink: 1;
      }
      .no-shrink {
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">Box 1</div>
      <div class="box no-shrink">Box 2</div>
    </div>
  </body>
</html>
