<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hover</title>
    <style>
      .button {
        padding: 10px 30px;
        border: none;
        border-radius: 10px;
        background-color: black;
        color: white;
        cursor: pointer;
        transition: all 0.8s ease;
      }
      .button:hover {
        transform: scale(1.1);
        background-color: #f5c05e;
      }
    </style>
  </head>
  <body>
    <button class="button">Hover Me</button>
  </body>
</html>
